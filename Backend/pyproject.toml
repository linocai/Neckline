[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neckline-runtime"
version = "3.0.2"
description = "Neckline production service runtime"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["neckline*"]

[tool.setuptools.package-data]
"neckline.config" = ["k10-v1.4.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
