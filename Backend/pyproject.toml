[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "neckline-runtime"
version = "2.4.0"
description = "Neckline production service runtime"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
where = ["."]
include = ["neckline*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
