# ══════════════════════════════════════════════════════════════════════════
# Neckline 公网入口 —— nginx-proxy-manager 官方 custom include(挂在 http{} 内)
# 生产路径:/opt/npm/data/nginx/custom/http.conf(= 容器 /data/custom/http.conf)
# 仓库副本:Neckline/deploy/npm-custom-http.conf   (V2-⑯-G,2026-08-04)
# ══════════════════════════════════════════════════════════════════════════
# 挂载点来自 NPM 自己的 nginx.conf 末尾:`include /data/nginx/custom/http[.]conf;`
# —— 官方留的扩展位,不改 NPM 生成的任何文件、不进它的 database.sqlite、
#    面板上看不见这个站(这是刻意的:面板改不到它,它也改不到面板的四个站)。
#
# 🔴 只服务 nk.linotsai.top,绝不接管 ln.linotsai.top —— A 路成立的全部依据就是
#    「老 App 与新 App 永不打同一个服务端」。接管 ln = 老 App 当场撞 V2 契约,
#    整份报告解不出(见 archive/对照表/V2_契约三方对拍_20260803.md §〇)。
#
# 🔴 三条会炸既有站的写法,别碰:
#   ① ⛔ 不许写 default_server —— :80/:443 的 default 归 NPM 的 conf.d/default.conf
#      (它同时是「Host: ln 打进来只见 Default Site、永远到不了 neckline」的物理闸门)。
#      再声明一个 = duplicate default server,nginx -t 直接挂,四个既有站一起起不来。
#      ⚠ archive/deploy_retired/nginx-neckline-nk.conf 里那个 `return 444` 的 default_server 是
#      「独占整台 nginx」的模板专用,搬到这里必炸。
#   ② ⛔ 不许建 /data/nginx/custom/server_proxy.conf —— 那个文件会被注入**每一个**
#      NPM proxy host(见各 proxy_host/*.conf 末行),是炸既有站的最短路径。
#   ③ ⛔ 不许在这里写 `map $scheme $hsts_header` 之类 http 级指令 —— 四个
#      proxy_host conf 已各自声明过。
#
# 改完必须:docker exec nginx-proxy-manager nginx -t  →  过了才 nginx -s reload;
#          reload 后拿 /root/npm-backup-<date>/regress.sh 与基线逐行对照。
# ══════════════════════════════════════════════════════════════════════════

# ── :80 —— ACME HTTP-01 + 全量 301 ────────────────────────────────────────
server {
    listen 80;
    listen [::]:80;
    server_name nk.linotsai.top;

    access_log /data/logs/neckline-nk_access.log proxy;
    error_log  /data/logs/neckline-nk_error.log warn;

    # 宿主 certbot --webroot -w /opt/npm/data/acme(= 容器 /data/acme)。
    # 续期靠宿主 certbot.timer;续期后由 deploy hook 把证书拷进 /data/custom-certs/nk/
    # 并 reload 本容器(/etc/letsencrypt/renewal-hooks/deploy/10-neckline-nk-to-npm.sh)。
    # ⚠ 这个 location 必须留着 —— 删了下次续期 HTTP-01 就验不过。
    location ^~ /.well-known/acme-challenge/ {
        auth_basic off;
        auth_request off;
        allow all;
        default_type "text/plain";
        root /data/acme;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

# ── :443 —— 反代到宿主 neckline API ───────────────────────────────────────
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name nk.linotsai.top;

    # 宿主 LE 证书的容器内副本(容器的 /etc/letsencrypt 是 NPM 自己的库,看不见宿主的)。
    ssl_certificate     /data/custom-certs/nk/fullchain.pem;
    ssl_certificate_key /data/custom-certs/nk/privkey.pem;
    include conf.d/include/ssl-ciphers.conf;

    access_log /data/logs/neckline-nk_access.log proxy;
    error_log  /data/logs/neckline-nk_error.log warn;

    # 交割单上传(multipart xlsx,4D/⑫-A)。NPM 全局是 2000m,这里刻意收窄。
    client_max_body_size 20m;

    location ^~ /.well-known/acme-challenge/ {
        default_type "text/plain";
        root /data/acme;
    }

    location / {
        # 172.18.0.1 = npm_default 桥网关 = 宿主;neckline 绑 0.0.0.0:8002,
        # 暴露面由 UFW「8002/tcp ALLOW IN 172.18.0.0/16」收口(外网直打 8002 仍被拒)。
        proxy_pass http://172.18.0.1:8002;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # LLM 问询台等端点墙钟可达 60s+(带联网搜索正常生成 30–60s),与
        # llm/openai_compat.read_timeout=90 对齐。NPM 全局 90s 会把长调用掐成 504,
        # 故在本 server 内放宽到 120s。⛔ 别调回短值。
        proxy_connect_timeout 15s;
        proxy_send_timeout    120s;
        proxy_read_timeout    120s;
    }
}
