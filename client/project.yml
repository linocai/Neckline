name: Neckline
options:
  bundleIdPrefix: top.linotsai
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "2.3.3"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: HX73DFL88G
    CODE_SIGN_STYLE: Automatic
    SWIFT_STRICT_CONCURRENCY: minimal
    ENABLE_USER_SCRIPT_SANDBOXING: YES

targets:
  Neckline:
    type: application
    supportedDestinations: [iOS, macOS]
    # 显式声明推送能力,让 Xcode automatic signing 给自动注册的 App ID 勾上 Push
    # (LinoN 的 App ID 是当年网页手动注册开 Push 的,新 App ID 没这一步会报
    #  "Entitlement aps-environment not found";此声明不足以修复时走网页兜底,见 PROJECT_PLAN §8)
    attributes:
      SystemCapabilities:
        com.apple.Push:
          enabled: 1
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    # ⚠ 2026-08-11 仓库整理:`DesignTokens.swift` 与 `Models.swift` 原先裸在 `client/` 根上,
    # 已分别归位到 `Neckline/Components/`(与其余 NK* 设计件同处)与 `Neckline/Networking/`
    # (与解它的 `APIClient.swift` 同处)。`- path: Neckline` 递归收全,故不再单列两行。
    sources:
      - path: Neckline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.linotsai.neckline
        PRODUCT_NAME: Neckline
        # ⚠ 与顶层 `settings.base.MARKETING_VERSION` **刻意重复一份**:守门单测
        # `tests/test_client_version_governance.py` 的 app target 判据是「buildSettings 块内
        # 同时含 `PRODUCT_NAME = Neckline;` 与 `MARKETING_VERSION`」——xcodegen 不把顶层 base
        # 下放到 target 块,只写顶层,该块就没有 MARKETING_VERSION、守门直接挂。
        # 重复值必须与顶层一致(单测同时断言两处相等,漂了会红)。
        MARKETING_VERSION: "2.3.3"
        # 推送 entitlement 仅 iOS 应用(真机/模拟器);macOS 不开推送(平台分叉,同 LinoN 姿势)。
        "CODE_SIGN_ENTITLEMENTS[sdk=iphoneos*]": Neckline/Neckline.entitlements
        "CODE_SIGN_ENTITLEMENTS[sdk=iphonesimulator*]": Neckline/Neckline.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_FILE: Neckline/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.finance
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: "UIInterfaceOrientationPortrait"
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_NSHumanReadableCopyright: ""

  NecklineTests:
    type: bundle.unit-test
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "26.0"
      macOS: "26.0"
    sources:
      - path: NecklineTests
    dependencies:
      - target: Neckline
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: top.linotsai.neckline.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  Neckline:
    build:
      targets:
        Neckline: all
        NecklineTests: [test]
    test:
      targets:
        - NecklineTests
    run:
      config: Debug
