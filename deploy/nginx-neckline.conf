# Neckline nginx 站点(plan 4B.4)——**参考配置,4B 不启用**。
#
# ⚠⚠ 本文件是 4E「接班切换」才启用的目标配置:把 ln.linotsai.top 的 upstream 从
# 127.0.0.1:8001(LinoN)切到 127.0.0.1:8002(Neckline)。**4B 阶段绝不动 linon 的 nginx
# 站点**(硬约束:绝不 stop/改 linon.service 或其 nginx 站点);Neckline 服务 4B 只在
# 127.0.0.1:8002 本地验 health,公网 HTTPS 走此站点是 4E 联调通过后的切换动作。
#
# 复用 LinoN 资产:域名 + 证书 ln.linotsai.top(ECDSA 到 2026-09-20,cron 自动续期健康)、
# DNS 已在,零新增用户网页操作(§3.6)。
#
# nginx 版本约束(hz 1.24.0):不支持 `http2 on;` 新指令(需 ≥1.25.1),用 `listen 443 ssl
# http2;` 旧写法(hz_info.md §7)。
#
# 4E 切换步骤(联调通过后):
#   sudo cp /etc/nginx/sites-available/linon /etc/nginx/sites-available/linon.bak.$(date +%Y%m%d-%H%M%S)
#   sudoedit /etc/nginx/sites-available/linon    # 把 proxy_pass 的 8001 改 8002(或换用本文件)
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo systemctl stop linon && sudo systemctl disable linon   # LinoN 退役
#   # 同步更新 ~/Lino/hz_info.md

server {
    listen 80;
    server_name ln.linotsai.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name ln.linotsai.top;

    ssl_certificate     /etc/letsencrypt/live/ln.linotsai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/ln.linotsai.top/privkey.pem;

    # 交割单上传(4D multipart xlsx):放宽 body 上限
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8002;     # ← Neckline(接班后;当前 LinoN 仍是 8001)
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }
}
