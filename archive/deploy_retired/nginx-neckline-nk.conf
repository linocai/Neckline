# Neckline **新机** nginx 站点(plan §五 V2-⑯-G;D2 = A 路已拍板)。
#
# ══════════════════════════════════════════════════════════════════════════
# 🔴🔴 **只服务 `nk.linotsai.top`,绝不接管 `ln.linotsai.top`** 🔴🔴
# ══════════════════════════════════════════════════════════════════════════
# A 路成立的**全部依据只有一句**:*老 App 与新 App 永远不会打到同一个服务端*。
# 一旦新机 nginx 顺手也接管了 `ln`,老 App 会当场撞上 V2 契约,而 V2 已经删了它硬
# 解码的键 —— 后果不是"少个字段",是**整份报告解不出、今日计划页全空**
# (逐条见 `archive/对照表/V2_契约三方对拍_20260803.md` §〇)。
# ⛔ 哪怕理由是"反正现在 DNS 还没指过来,先写上以后省事"也不行 —— DNS 是用户手上的
#    开关,配置先写好就等于把闸门交给了一次误操作。
# 现场自检见 `archive/deploy_retired/A路割接前提自检清单.md` P1/P2 与 `archive/deploy_retired/preflight_a_route.sh`。
#
# ❌❌ **本文件已作废,未投产,也不要投产** —— 留档仅为记录「独占整台 nginx」那条路
#   长什么样。**⑯-G 最终走的是 nginx-proxy-manager 自定义 include 路线**:
#   现役配置 = `deploy/npm-custom-http.conf`(生产路径
#   `/opt/npm/data/nginx/custom/http.conf`),证书投递 = `deploy/npm-le-deploy-hook.sh`。
#   原因:新机 80/443 归用户既有的 NPM 容器(反代 nas/mt/web + 一个 IP 站),系统 nginx
#   `bind() 0.0.0.0:80 failed`,已 stop + disable。
#   🔴 **搬运本文件到 NPM 的 custom include 会当场炸掉那四个既有站** —— 下面那个
#   `return 444` 的 `default_server` 与 NPM 自己的 `conf.d/default.conf` 重复声明,
#   `nginx -t` 直接挂;而且 NPM 的那个 default 正是「Host: ln 打进来永远到不了
#   neckline」的物理闸门,不该、也不需要由本文件再造一个。
#
# nginx 版本约束(新机 1.24.0,同老机):**不支持 `http2 on;` 新指令**(需 ≥1.25.1),
# 用 `listen 443 ssl http2;` 旧写法。
#
# 安装:
#   sudo cp /opt/neckline/archive/deploy_retired/nginx-neckline-nk.conf /etc/nginx/sites-available/neckline-nk
#   sudo ln -s /etc/nginx/sites-available/neckline-nk /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   # 证书(**解析生效后才申请**,判据 = nk 解析拿到新机 IP):
#   sudo certbot --nginx -d nk.linotsai.top
#   # 续期由 certbot 自带 systemd timer 接管,装完 `systemctl list-timers | grep certbot` 复核。

# —— 兜底 server:吃下所有"不是 nk"的 Host,直接断连 ——————————————————————
# 这是 A 路自检 P2 / R4 的**结构性保证**:哪怕哪天有人把 `ln.linotsai.top` 解析到本机,
# 也只会撞到这里 444(连响应都不给),而不会被转给 V2 后端。
# ⛔ 删掉这一段 = 把 A 路的最后一道物理闸门拆了。
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    return 444;
}

server {
    listen 80;
    listen [::]:80;
    server_name nk.linotsai.top;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name nk.linotsai.top;

    # certbot --nginx 会把下面两行改成它托管的实际路径,并追加它自己的托管块。
    ssl_certificate     /etc/letsencrypt/live/nk.linotsai.top/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nk.linotsai.top/privkey.pem;

    # 交割单上传(multipart xlsx,4D/⑫-A):放宽 body 上限。
    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8002;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # LLM 问询台等端点墙钟可达 60s+(带联网搜索的调用正常生成 30–60s),
        # 与 `llm/openai_compat.read_timeout=90` 对齐,别设短了把长调用掐成 504。
        proxy_read_timeout 120s;
    }
}
